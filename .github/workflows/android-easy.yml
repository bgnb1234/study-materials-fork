name: Android APK

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDK_MANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDK_MANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDK_MANAGER" --licenses > /dev/null 2>&1 || true
          "$SDK_MANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "NDK_HOME=$SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android-easy
      - run: pnpm install --frozen-lockfile
      - name: Initialize Android
        run: pnpm tauri android init --ci
      - name: Prepare install signing key
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$HOME/.android"
          PREVIOUS=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=android-install-key&per_page=10" --jq '[.artifacts[] | select(.expired == false)][0].id // empty')
          if [ -n "$PREVIOUS" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$PREVIOUS/zip" > "$RUNNER_TEMP/key.zip"
            unzip -o "$RUNNER_TEMP/key.zip" -d "$HOME/.android"
          else
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: android-install-key
          path: ~/.android/debug.keystore
          retention-days: 90
      - name: Build installable APK
        run: pnpm tauri android build --debug --apk --target aarch64
      - name: Collect APK
        shell: bash
        run: |
          mkdir -p apk-output
          find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' -exec cp {} apk-output/ \;
          test -n "$(find apk-output -name '*.apk' -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: HGhub-Android-APK
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 30
